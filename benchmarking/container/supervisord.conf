[unix_http_server]
file=/tmp/lab-supervisor.sock
chmod=0700

[supervisord]
logfile=/var/log/lab/supervisor.log
pidfile=/tmp/lab-supervisor.pid
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/lab-supervisor.sock

[program:broker]
command=/usr/sbin/rabbitmq-server
user=rabbitmq
environment=HOME="/var/lib/rabbitmq",USER="rabbitmq",LOGNAME="rabbitmq"
priority=10
autorestart=unexpected
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/lab/broker.log
stderr_logfile=/var/log/lab/broker-error.log

[program:pricing]
command=/opt/lab/run-service.sh pricing
priority=20
autorestart=unexpected
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/lab/pricing.log
stderr_logfile=/var/log/lab/pricing-error.log

[program:order]
command=/opt/lab/run-service.sh order
priority=20
autorestart=unexpected
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/lab/order.log
stderr_logfile=/var/log/lab/order-error.log

[program:risk]
command=/opt/lab/run-service.sh risk
priority=20
autorestart=unexpected
startsecs=3
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/lab/risk.log
stderr_logfile=/var/log/lab/risk-error.log

[program:workflow]
command=/opt/lab/run-service.sh workflow
priority=20
autorestart=unexpected
startsecs=3
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/lab/workflow.log
stderr_logfile=/var/log/lab/workflow-error.log

[program:gateway]
command=/opt/lab/run-service.sh gateway
priority=20
autorestart=unexpected
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/lab/gateway.log
stderr_logfile=/var/log/lab/gateway-error.log

[program:results]
command=python3 /opt/lab/results_server.py --directory /lab/data --port 8090
priority=30
autorestart=unexpected
stopasgroup=true
stdout_logfile=/var/log/lab/results.log
stderr_logfile=/var/log/lab/results-error.log
